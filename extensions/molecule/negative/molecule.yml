---
# What the roles refuse, before anything changes (docs/design.md, principle 5). prepare
# deploys a two-node cluster; converge runs one play per refused input, each expecting the
# refusal; verify checks the nodes weren't touched.
dependency:
  name: galaxy
  enabled: false

driver:
  name: default
  options:
    managed: true

platforms:
  - name: garage-negative-1
    image: &image "${MOLECULE_IMAGE:-geerlingguy/docker-debian13-ansible:latest}"
    systemd: true
    groups: &groups [garage_nodes, docker_instances]
  - name: garage-negative-2
    image: *image
    systemd: true
    groups: *groups

provisioner:
  name: ansible
  playbooks:
    create: ../default/create.yml
    destroy: ../default/destroy.yml
    prepare: prepare.yml
    converge: converge.yml
    verify: verify.yml
  inventory:
    links:
      group_vars: inventory/group_vars/
      host_vars: inventory/host_vars/

verifier:
  name: ansible

scenario:
  name: negative
  test_sequence:
    - destroy
    - syntax
    - create
    - prepare
    - converge
    - verify
    - destroy
