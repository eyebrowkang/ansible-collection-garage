---
# The cluster prepare deploys; each play of converge overrides what it tests.
garage_node_version: v2.6.0
# A fixed test-only secret (openssl rand -hex 32); never use it outside molecule.
garage_node_rpc_secret: 7f3a9c1e5b2d8f4a6c0e9b3d7f1a5c8e2b6d0f4a9c3e7b1d5f8a2c6e0b4d9f3a
# The plays change copies of negative_settings, so it's the literal one.
negative_settings:
  metadata_dir: /var/lib/garage/meta
  data_dir: /var/lib/garage/data
  replication_factor: 2
garage_node_settings: "{{ negative_settings }}"
