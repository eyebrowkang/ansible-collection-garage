---
# Vagrant + libvirt scenario: the node on a real VM, before a release (docs/design.md,
# "Supported platforms and tests"). Runs locally (`make test-vm`; needs libvirt + KVM).
#
# molecule-plugins#301: run this via `make test-vm`, which exports ANSIBLE_LIBRARY /
# ANSIBLE_FILTER_PLUGINS so Ansible can find the vagrant module/filter. A bare
# `molecule test -s vagrant` fails without those (see docs/molecule-301-workaround.md).
dependency:
  name: galaxy   # auto-installs collections.yml + requirements.yml (scenario-absolute paths)

driver:
  name: vagrant
  provider:
    name: libvirt

platforms:
  - name: garage-node-vm
    box: debian/trixie64
    memory: 1024
    cpus: 1
    groups:
      - garage_nodes

provisioner:
  name: ansible
  # The docker scenario's playbooks and test variables (the same linked inventory). The
  # vagrant driver supplies ansible_user itself.
  playbooks:
    converge: ../default/converge.yml
    verify: ../default/verify.yml
  inventory:
    links:
      group_vars: ../default/inventory/group_vars/

verifier:
  name: ansible

scenario:
  name: vagrant
  test_sequence:
    - dependency
    - destroy
    - syntax
    - create
    - converge
    - idempotence
    - verify
    - destroy
