---
# Checks the node from the host's real state: what the binary reports, what systemd
# reports, the files on disk, and Garage answering on its ports.
- name: Verify
  hosts: all
  become: true
  tasks:
    - name: Ask the binary for its version
      ansible.builtin.command: /usr/local/bin/garage --version
      register: verify_version
      changed_when: false

    - name: Check the version
      ansible.builtin.assert:
        that: (verify_version.stdout | eyebrowkang.garage.garage_version) == garage_node_version
        fail_msg: "Expected Garage {{ garage_node_version }}, the binary reports: {{ verify_version.stdout }}"

    - name: Read the services as systemd reports them
      ansible.builtin.service_facts:

    - name: Check garage.service runs and is enabled
      ansible.builtin.assert:
        that:
          - ansible_facts.services['garage.service'].state == 'running'
          - ansible_facts.services['garage.service'].status == 'enabled'

    - name: Read garage.toml
      ansible.builtin.slurp:
        src: /etc/garage/garage.toml
      register: verify_config

    - name: Check garage.toml is the settings, the defaults and the secret files
      vars:
        written: "{{ verify_config.content | b64decode | eyebrowkang.garage.from_toml }}"
      ansible.builtin.assert:
        that:
          - written.metadata_dir == garage_node_settings.metadata_dir
          - written.replication_factor == 1
          - written.rpc_bind_addr == '[::]:3901'
          - written.rpc_secret_file == '/etc/garage/secrets/rpc_secret'
          - written.rpc_secret is not defined
          - written.s3_api.s3_region == 'garage'
          - written.s3_api.public_endpoint == 'http://s3.garage.test'
          - written.admin.admin_token_file == '/etc/garage/secrets/admin_token'
          - written.admin.metrics_token_file is not defined
        fail_msg: "garage.toml is not what was asked for: {{ written }}"

    - name: Read the secret files
      ansible.builtin.stat:
        path: "/etc/garage/secrets/{{ item }}"
      loop: [rpc_secret, admin_token, metrics_token]
      register: verify_secrets

    - name: Check the secret files are the garage user's alone
      vars:
        by_name: "{{ dict(verify_secrets.results | map(attribute='item') | zip(verify_secrets.results | map(attribute='stat'))) }}"
      ansible.builtin.assert:
        that:
          - by_name.rpc_secret.pw_name == 'garage'
          - by_name.rpc_secret.mode == '0600'
          - by_name.admin_token.mode == '0600'
          - not by_name.metrics_token.exists

    - name: Ask Garage for the node's status over RPC
      ansible.builtin.command: /usr/local/bin/garage --config /etc/garage/garage.toml status
      register: verify_status
      changed_when: false

    - name: Ask the admin API for the node, with the token
      ansible.builtin.uri:
        url: http://localhost:3903/v2/GetNodeInfo?node=self
        headers:
          Authorization: Bearer {{ garage_node_admin_token }}
      register: verify_node_info

    - name: Check the S3 API answers
      ansible.builtin.uri:
        url: http://localhost:3900/
        status_code: [403]
