---
# One Garage node, on the distribution MOLECULE_DISTRO names: installed, configured and
# started by the node role, then checked from the host's real state. Molecule's built-in
# default (delegated) driver with community.docker create/destroy playbooks.
dependency:
  name: galaxy   # auto-installs collections.yml + requirements.yml (scenario-absolute paths)

driver:
  name: default
  options:
    managed: true

platforms:
  # One node per distribution: MOLECULE_DISTRO names it and MOLECULE_IMAGE is its image
  # (CI runs the matrix), a systemd-enabled image with Python. Molecule doesn't nest
  # defaults, so the image is given whole; debian13 unless set.
  - name: garage-node-${MOLECULE_DISTRO:-debian13}
    image: "${MOLECULE_IMAGE:-geerlingguy/docker-debian13-ansible:latest}"
    systemd: true
    groups:
      - garage_nodes
      # inventory/group_vars/docker_instances.yml turns become off for docker instances.
      - docker_instances

provisioner:
  name: ansible
  playbooks:
    create: create.yml
    prepare: prepare.yml
    destroy: destroy.yml
    converge: converge.yml
    side_effect: side_effect.yml
    verify: verify.yml
  inventory:
    # The test variables (inventory/group_vars/), shared with the other scenarios.
    links:
      group_vars: inventory/group_vars/

verifier:
  name: ansible

scenario:
  name: default
  test_sequence:
    - dependency
    - destroy
    - syntax
    - create
    - prepare
    - converge
    - idempotence
    - side_effect
    - verify
    - destroy
