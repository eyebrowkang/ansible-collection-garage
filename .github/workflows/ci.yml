---
name: CI
# A pull request runs once (not also as a push), and a new push to it cancels its run in
# progress. main runs the whole distribution matrix on each push and weekly.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Monday 05:17 UTC: the whole matrix against the images' latest builds.
    - cron: "17 5 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    # ansible-test must run from ansible_collections/<ns>/<name>/; check out there and
    # run everything from that path (also keeps ansible-lint collection-aware).
    working-directory: ansible_collections/eyebrowkang/garage

jobs:
  # What the molecule jobs run: nothing when only documentation changed (the docs checks are
  # unit tests), and on a pull request one distribution per family - the whole matrix runs on
  # main, weekly and by hand.
  plan:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.changes.outputs.code }}
      distros: ${{ steps.matrix.outputs.distros }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: ansible_collections/eyebrowkang/garage
          fetch-depth: 0
      - name: Tell whether anything but documentation changed
        id: changes
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ "${{ github.event_name }}" != pull_request ] && [ "${{ github.event_name }}" != push ] \
             || [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "code=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # Read the whole list (no grep -q): a producer cut short would fail the pipeline
          # under pipefail and read as "documentation only".
          code=$(git diff --name-only "$BASE" HEAD \
                 | grep -vE '(\.md$|^docs/|^changelogs/fragments/)' || true)
          if [ -n "$code" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Pick the distributions
        id: matrix
        env:
          ALL: >-
            [{"distro": "debian12", "image": "geerlingguy/docker-debian12-ansible:latest"},
             {"distro": "debian13", "image": "geerlingguy/docker-debian13-ansible:latest"},
             {"distro": "ubuntu2204", "image": "geerlingguy/docker-ubuntu2204-ansible:latest"},
             {"distro": "ubuntu2404", "image": "geerlingguy/docker-ubuntu2404-ansible:latest"},
             {"distro": "rockylinux8", "image": "geerlingguy/docker-rockylinux8-ansible:latest"},
             {"distro": "rockylinux9", "image": "geerlingguy/docker-rockylinux9-ansible:latest"},
             {"distro": "rockylinux10", "image": "geerlingguy/docker-rockylinux10-ansible:latest"},
             {"distro": "fedora43", "image": "geerlingguy/docker-fedora43-ansible:latest"},
             {"distro": "opensuseleap16", "image": "geerlingguy/docker-opensuseleap16-ansible:latest"},
             {"distro": "archlinux", "image": "carlodepieri/docker-archlinux-ansible:latest"}]
          # One per family: Debian, Enterprise Linux (the oldest, whose Python prepare
          # provides), openSUSE, Arch (a third-party image).
          PULL_REQUEST: '["debian13", "rockylinux8", "opensuseleap16", "archlinux"]'
        run: |
          if [ "${{ github.event_name }}" = pull_request ]; then
            distros=$(jq -c --argjson pick "$PULL_REQUEST" 'map(select(.distro | IN($pick[])))' <<< "$ALL")
          else
            distros=$(jq -c . <<< "$ALL")
          fi
          echo "distros=$distros" >> "$GITHUB_OUTPUT"

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: ansible_collections/eyebrowkang/garage
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run ansible-galaxy collection install -r extensions/molecule/default/collections.yml
      - run: uv run yamllint .
      - run: uv run ansible-lint

  sanity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: ansible_collections/eyebrowkang/garage
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - name: ansible-test sanity
        run: uv run ansible-test sanity --venv --color

  units:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: ansible_collections/eyebrowkang/garage
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - name: ansible-test units
        run: uv run ansible-test units --venv --color

  molecule:
    runs-on: ubuntu-latest
    needs: [plan, lint]
    if: needs.plan.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.distros) }}
    env:
      MOLECULE_DISTRO: ${{ matrix.distro }}
      MOLECULE_IMAGE: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: ansible_collections/eyebrowkang/garage
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - name: Molecule (one node, docker)
        run: uv run molecule test
      - name: Destroy
        if: always()
        run: uv run molecule destroy

  # The other scenarios, on Debian 13: what they test isn't distribution-specific.
  scenario:
    runs-on: ubuntu-latest
    needs: [plan, lint]
    if: needs.plan.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        scenario: [cluster, takeover, major, lifecycle, negative]
    steps:
      - uses: actions/checkout@v4
        with:
          path: ansible_collections/eyebrowkang/garage
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      # Their create.yml needs community.docker, which the default scenario lists (their
      # dependency step is off).
      - run: uv run ansible-galaxy collection install -r extensions/molecule/default/collections.yml
      - name: Molecule (${{ matrix.scenario }}, docker)
        run: uv run molecule test -s ${{ matrix.scenario }}
      - name: Destroy
        if: always()
        run: uv run molecule destroy -s ${{ matrix.scenario }}
