---
# Each node connects to the nodes of the play it doesn't see up, then waits until it sees
# them all. Garage keeps its peers and gossips them, so this is a bootstrap: a run where every
# node already sees the others connects nothing.
- name: Tell which nodes to connect
  vars:
    others: "{{ ansible_play_hosts | difference([inventory_hostname]) | map('extract', hostvars) | list }}"
  ansible.builtin.set_fact:
    garage_cluster_wanted: >-
      {{ dict(others | map(attribute='garage_cluster_node_id')
              | zip(others | map(attribute='garage_cluster_node_addr'))) }}

- name: Tell which nodes this node doesn't see up
  ansible.builtin.set_fact:
    garage_cluster_to_connect: >-
      {{ garage_cluster_status.stdout | from_json
         | eyebrowkang.garage.garage_nodes_to_connect(garage_cluster_wanted) }}

- name: Report the connections
  ansible.builtin.debug:
    msg: "Would connect to {{ garage_cluster_to_connect | join(', ') }}."
  changed_when: true
  when:
    - garage_cluster_to_connect | length > 0
    - ansible_check_mode

- name: Connect to the other nodes
  when:
    - garage_cluster_to_connect | length > 0
    - not ansible_check_mode
  block:
    - name: Connect to the nodes not seen up
      ansible.builtin.command:
        argv: "{{ garage_cluster_garage + ['json-api', 'ConnectClusterNodes', garage_cluster_to_connect | to_json] }}"
      register: garage_cluster_connected
      changed_when: true

    - name: Check every connection succeeded
      vars:
        results: "{{ garage_cluster_connected.stdout | from_json }}"
        failed: "{{ garage_cluster_to_connect | zip(results) | rejectattr('1.success') | list }}"
      ansible.builtin.assert:
        that: failed | length == 0
        fail_msg: >-
          Couldn't connect to {{ failed | map('first') | join(', ') }}:
          {{ failed | map(attribute='1.error') | join('; ') }}
        quiet: true

    - name: Wait until this node sees the other nodes up
      ansible.builtin.command:
        argv: "{{ garage_cluster_garage + ['json-api', 'GetClusterStatus'] }}"
      register: garage_cluster_status
      changed_when: false
      until: >-
        garage_cluster_status.rc == 0
        and (garage_cluster_status.stdout | from_json
             | eyebrowkang.garage.garage_nodes_not_up(garage_cluster_wanted) | length == 0)
      retries: "{{ garage_cluster_wait_retries }}"
      delay: "{{ garage_cluster_wait_delay }}"

# Garage saves a node's peers every minute, and a restarted node finds the others again only
# through that list: the bootstrap is done when every node has saved the others.
- name: Read where the node keeps its metadata
  ansible.builtin.slurp:
    src: "{{ garage_cluster_config_path }}"
  register: garage_cluster_config

- name: Wait until the node has saved the other nodes as its peers
  ansible.builtin.slurp:
    src: "{{ (garage_cluster_config.content | b64decode | eyebrowkang.garage.from_toml).metadata_dir }}/peer_list"
  register: garage_cluster_peer_list
  until: >-
    garage_cluster_peer_list is not failed
    and (garage_cluster_peer_list.content | eyebrowkang.garage.garage_peer_list_count)
        >= garage_cluster_wanted | length
  retries: "{{ garage_cluster_peers_retries }}"
  delay: "{{ garage_cluster_wait_delay }}"
  when: not ansible_check_mode
