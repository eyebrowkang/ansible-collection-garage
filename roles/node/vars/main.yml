---
# Internal data for the node role: overriding it isn't supported (docs/design.md, "Interface
# between the roles"). These are the eyebrowkang.garage role's defaults, so a host it deployed
# is taken over in place.
garage_node_binary_path: /usr/local/bin/garage
garage_node_user: garage
garage_node_group: garage
garage_node_home: /var/lib/garage
garage_node_config_dir: /etc/garage
garage_node_config_path: /etc/garage/garage.toml
garage_node_secrets_dir: /etc/garage/secrets
garage_node_unit_path: /etc/systemd/system/garage.service
garage_node_dropin_path: /etc/systemd/system/garage.service.d/eyebrowkang-garage.conf
# Where a download waits for its checks (it runs once from there: not /tmp, which may be
# noexec).
garage_node_download_parent: /var/tmp
# The command that reaches the local node over RPC, with only the RPC secret.
garage_node_garage:
  - "{{ garage_node_binary_path }}"
  - --config
  - "{{ garage_node_config_path }}"
# How long a started or restarted node has to be back as healthy as before: 2 minutes.
garage_node_wait_retries: 60
garage_node_wait_delay: 2

# The first line of the files the role writes, so a takeover tells them from the role's.
garage_node_marker: "Managed by the eyebrowkang.garage collection (node role)"

# What the eyebrowkang.garage role left that the collection doesn't use.
garage_node_role_leftovers:
  - /etc/garage/garage.env
  - /usr/local/bin/garage.bak

# The oldest Garage the collection runs.
garage_node_min_version: v2.0.0

# The settings the node role writes unless garage_node_settings sets them: the
# eyebrowkang.garage role's former values (docs/design.md, principle 3).
garage_node_settings_defaults:
  rpc_bind_addr: "[::]:3901"
  s3_api:
    api_bind_addr: "[::]:3900"
    s3_region: garage
  admin:
    api_bind_addr: "[::]:3903"

# The variables of the eyebrowkang.garage role. Any of them still set means a play written
# for the role: the collection doesn't read them, so the run fails instead of ignoring them.
garage_node_role_variables:
  - garage_version
  - garage_user
  - garage_group
  - garage_home
  - garage_config_dir
  - garage_data_dir
  - garage_data_dirs
  - garage_metadata_dir
  - garage_db_engine
  - garage_replication_factor
  - garage_rpc_secret
  - garage_rpc_secret_file
  - garage_rpc_bind_addr
  - garage_rpc_public_addr
  - garage_bootstrap_peers
  - garage_s3_region
  - garage_s3_api_bind_addr
  - garage_s3_root_domain
  - garage_s3_public_endpoint
  - garage_s3_web_bind_addr
  - garage_s3_web_root_domain
  - garage_admin_api_bind_addr
  - garage_admin_healthcheck_host
  - garage_healthcheck_enabled
  - garage_admin_token
  - garage_admin_token_file
  - garage_metrics_token
  - garage_metrics_token_file
  - garage_cluster_connect
  - garage_cluster_hosts
  - garage_layout_init
  - garage_layout_zone
  - garage_layout_capacity
  - garage_layout_gateway
  - garage_layout_tags
  - garage_upgrade
  - garage_upgrade_precheck
  - garage_checksum
  - garage_download_url
  - garage_download_local
  - garage_config_template
  - garage_no_log
  - garage_env_variables

# ansible_facts['architecture'] -> Garage's build for it.
garage_node_arch_map:
  x86_64: x86_64-unknown-linux-musl
  aarch64: aarch64-unknown-linux-musl
  armv7l: armv6l-unknown-linux-musleabihf
  armv6l: armv6l-unknown-linux-musleabihf
  i686: i686-unknown-linux-musl
  i386: i686-unknown-linux-musl
garage_node_arch: "{{ garage_node_arch_map[ansible_facts['architecture']] | default('') }}"

# Controller directory caching one download, per URL.
garage_node_controller_cache: "{{ garage_node_cache_dir | expanduser }}/{{ garage_node_url | hash('sha1') }}"

# SHA256 of each release's binary, by architecture: the trust root (docs/design.md,
