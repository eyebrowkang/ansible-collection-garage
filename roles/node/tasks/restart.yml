---
# Restarts garage_node_target, then waits until it's as healthy as it was before the next node
# stops: connected to as many nodes, with as many storage nodes up, and healthy if it was
# (docs/design.md, "Restarts").
- name: Ask how healthy the cluster is before restarting {{ garage_node_target }}
  ansible.builtin.command:
    argv: "{{ garage_node_garage + ['json-api', 'GetClusterHealth'] }}"
  register: garage_node_health_before
  changed_when: false
  failed_when: false
  delegate_to: "{{ garage_node_target }}"

- name: Restart {{ garage_node_target }}
  ansible.builtin.systemd_service:
    name: garage.service
    state: restarted
  delegate_to: "{{ garage_node_target }}"

- name: Wait for {{ garage_node_target }}
  ansible.builtin.include_tasks: wait.yml
  vars:
    garage_node_health_floor: >-
      {{ garage_node_health_before.stdout | from_json
         if garage_node_health_before.rc == 0 else {} }}
